# ==============================================================================
# CONFIGURACIÓN NGINX PARA CONSUR S.A. DETRÁS DE CLOUDFLARE
# Ubicación recomendada en el VPS: /etc/nginx/sites-available/consur.com.py
# ==============================================================================

# 1. RANGOS IP OFICIALES DE CLOUDFLARE PARA RESTAURACIÓN DE IP REAL
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;

# Rangos IPv6 de Cloudflare
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

real_ip_header CF-Connecting-IP;

server {
    listen 80;
    listen [::]:80;
    server_name consur.com.py www.consur.com.py;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name consur.com.py www.consur.com.py;

    # Certificado Cloudflare Origin CA (SSL Full Strict)
    ssl_certificate /etc/ssl/certs/consur_cloudflare_origin.pem;
    ssl_certificate_key /etc/ssl/private/consur_cloudflare_origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /var/www/consur_new_code/public;
    index index.php index.html;

    charset utf-8;
    client_max_body_size 64M;

    # Compresión Gzip para alto rendimiento (Minimizar TTFB)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Bloqueo estricto de archivos ocultos y sensibles (.env, .git, etc.)
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Caché estática agresiva para assets compilados por Vite
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff|woff2|ttf|otf)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, no-transform, max-age=2592000";
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Procesamiento PHP-FPM 8.3
    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 180;
    }
}

